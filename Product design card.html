<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        /* Base page reset and center alignment */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Product Card Container */
        .product-card {
            background-color: #ffffff;
            width: 300px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Hover effect on card */
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Product Image Styling */
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Title */
        .product-title {
            font-size: 20px;
            color: #333333;
            margin-bottom: 10px;
        }

        /* Description */
        .product-description {
            font-size: 14px;
            color: #666666;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* Price Tag */
        .price-tag {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        /* Buy Now Button */
        .buy-btn {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        /* Hover effect on button */
        .buy-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" class="product-image">
        <h2 class="product-title">Wireless Headphones</h2>
        <p class="product-description">Experience high-quality audio with noise cancellation and long battery life.</p>
        <div class="price-tag">$99.99</div>
        <button class="buy-btn">Buy Now</button>
    </div>

</body>
</html>
